# Compile l'APK Android GoldFlow SMC dans le cloud (aucun outil Android requis en local).
# Déclenchement : manuel (bouton « Run workflow » sur GitHub) ou à chaque tag `apk-*`.
# Résultat : fichier goldflow-smc.apk téléchargeable dans les « Artifacts » du run.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Build web app (pointed at the Render backend)
        env:
          REACT_APP_BACKEND_URL: https://goldflow-backend.onrender.com
          # CRA transforme les warnings eslint en erreurs quand CI=true — on garde le comportement local
          CI: "false"
        run: corepack yarn build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signature PERMANENTE : sans cette étape, chaque build serait signé avec une
      # clé jetable générée sur le runner → Android refuserait d'installer la mise à
      # jour par-dessus l'app existante (il faudrait désinstaller à chaque fois).
      # La clé (PKCS12, alias/mot de passe standard du keystore de debug Android) vit
      # dans le secret ANDROID_DEBUG_KEYSTORE_B64 ; copie de secours chez David
      # (dossier cles-apk/ hors dépôt). On échoue EXPLICITEMENT si le secret manque.
      - name: Install persistent signing key
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_B64 manquant — l'APK serait signé avec une clé jetable (mise à jour impossible sans désinstaller). Ajouter le secret depuis cles-apk/goldflow-debug.keystore.b64."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk goldflow-smc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: goldflow-smc-apk
          path: frontend/goldflow-smc.apk
          retention-days: 30
